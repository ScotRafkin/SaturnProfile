# CASSPIAN build control file for the forward run shear_r7f_decay_linp_fine (SPEC_00 section 2.2.2
# and 2.3, SPEC_03 Step 3 deliverable 1, SPEC_04 Step 0 deliverable 3). Pointers and
# declared choices only.
#
# The same five sections as forward/lindal_closure/lindal_closure_build.toml, pointing at
# the same sources with this run's prefix, so that the transfer runs under the one state in
# hand. Two things differ from the closure, and both are SPEC_04 Step 0: the wind is written
# in the three parts of deliverable 1, and the composition is written on the latitude grid
# of deliverable 2, the Lindal column carried to every latitude as a hypothesis. A transfer
# run makes no closure comparison, so its inputs are not checked against the anchor's.
# Built by: casspian-run-inputs forward/shear_r7f_decay_linp_fine/shear_r7f_decay_linp_fine_build.toml

[gravity]
source = "../../data_static/harmonics/null1981.toml"
output = "inputs/shear_r7f_decay_linp_fine_gravity.nc"
prefix = "shear_r7f_decay_linp_fine"
role   = "forward"
epoch  = "1981-08-26"   # SPEC_01 v0.28: the date of the occultation the run transfers from
title  = "Null et al. (1981) harmonic set, as assumed by the shear_r7f_decay_linp_fine run"

[rotation]
source = "../../data_static/rotation/system_iii.toml"
entry  = "system_iii"
output = "inputs/shear_r7f_decay_linp_fine_rotation.nc"
prefix = "shear_r7f_decay_linp_fine"
role   = "forward"
epoch  = "1981-08-26"
title  = "System III rotation, as assumed by the shear_r7f_decay_linp_fine run"

[wind]
# The run's own gravity and rotation files; the raw bundle for the reference geoid polar radius
# (SPEC_03 v0.10 section 8 ruling 4). A build file may point outside the run directory.
wind_source_kind = "curve"
curve_source     = "../../data_static/winds/ingersoll_pollard1982_fig5_curve.csv"
points_source    = "../../data_static/winds/smith1982_fig4_points.csv"
data_properties  = "../../data_static/winds/smith1982_fig4.toml"
gravity_file     = "inputs/shear_r7f_decay_linp_fine_gravity.nc"
rotation_file    = "inputs/shear_r7f_decay_linp_fine_rotation.nc"
raw_bundle       = "../../occul_data/lindal/raw/lindal_raw.nc"
output           = "inputs/shear_r7f_decay_linp_fine_wind_source.nc"
prefix           = "shear_r7f_decay_linp_fine"
role             = "forward"
title            = "Ingersoll and Pollard (1982) cloud top zonal wind, as assumed by the shear_r7f_decay_linp_fine run"

bin_width_deg     = 2.0
min_count_per_bin = 3

gap_rule        = "reflect_north"
polar_rule      = "pchip_to_zero"
join_window_deg = [-10.9, -15.0]

latitude_grid_step_deg = 0.5
vertical_structure     = "altitude independent"

pressure_grid_Pa = [
  1, 1.12202, 1.25893, 1.41254, 1.58489, 1.77828, 1.99526, 2.23872, 2.51189, 2.81838,
  3.16228, 3.54813, 3.98107, 4.46684, 5.01187, 5.62341, 6.30957, 7.07946, 7.94328, 8.91251,
  10, 11.2202, 12.5893, 14.1254, 15.8489, 17.7828, 19.9526, 22.3872, 25.1189, 28.1838,
  31.6228, 35.4813, 39.8107, 44.6684, 50.1187, 56.2341, 63.0957, 70.7946, 79.4328, 89.1251,
  100, 112.202, 125.893, 141.254, 158.489, 177.828, 199.526, 223.872, 251.189, 281.838,
  316.228, 354.813, 398.107, 446.684, 501.187, 562.341, 630.957, 707.946, 794.328, 891.251,
  1000, 1122.02, 1258.93, 1412.54, 1584.89, 1778.28, 1995.26, 2238.72, 2511.89, 2818.38,
  3162.28, 3548.13, 3981.07, 4466.84, 5011.87, 5623.41, 6309.57, 7079.46, 7943.28, 8912.51,
  10000, 11220.2, 12589.3, 14125.4, 15848.9, 17782.8, 19952.6, 22387.2, 25118.9, 28183.8,
  31622.8, 35481.3, 39810.7, 44668.4, 50118.7, 56234.1, 63095.7, 70794.6, 79432.8, 89125.1,
  100000, 112202, 125893, 141254, 158489, 177828, 199526, 223872, 251189, 281838,
  316228, 354813, 398107, 446684, 501187, 562341, 630957, 707946, 794328, 891251,
  1e+06
]

[shear]
# SPEC_05 Step 3: the shear step is part of every forward run's build. [wind] writes the source
# wind; this section writes the wind the namelist reads. identity returns the source as it is.
source = "inputs/shear_r7f_decay_linp_fine_wind_source.nc"
output = "inputs/shear_r7f_decay_linp_fine_wind.nc"
case   = "decay_above"
shear_reference_pressure_Pa = 1.0e5
shape  = "linear_p"
stop_pressure_Pa = 0.0
stop_fraction    = 0.0

[composition]
# casspian-composition-lindal with its output redirected: the generic composition tool does not
# exist yet (the forward-inputs specification). latitude_grid_deg writes the same column at
# every node of the grid (SPEC_04 Step 0 deliverable 2); whether the field is uniform in
# latitude is then a property of its values and not a tag.
raw_bundle     = "../../occul_data/lindal/raw/lindal_raw.nc"
species_master = "../../data_static/species_master.toml"
species_set    = "lindal1985"
output         = "inputs/shear_r7f_decay_linp_fine_composition.nc"
prefix         = "shear_r7f_decay_linp_fine"
role           = "forward"
title          = "Lindal et al. (1985) composition, 94 percent H2 with He and NH3, as assumed by the shear_r7f_decay_linp_fine run"

h2_fraction_of_remainder = 0.94
he_fraction_of_remainder = 0.06

nh3_fill_rule = "linear in pressure through the tabulated Table I values, extrapolated beyond them by scipy.interpolate.interp1d(fill_value='extrapolate'), then clamped at zero; ammonia is assigned first and the remainder is split by the two shares above"
vertical_coordinate = "pressure_Pa"
latitude_grid_deg   = [-90.0, 90.0, 1.0]
