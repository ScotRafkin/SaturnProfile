[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casspian"
version = "0.1.0"
description = "CASSPIAN Saturn atmosphere reference model"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "netCDF4",
]

# Console entry points are added as the tools of SPEC_01 appear.
[project.scripts]
casspian-lindal-raw = "casspian.tools.lindal.build_raw:main"
casspian-gravity-file = "casspian.tools.gravity.build_gravity:main"
casspian-rotation-file = "casspian.tools.gravity.build_rotation:main"
casspian-wind-from-curve = "casspian.tools.wind.build_wind:main"
casspian-composition-lindal = "casspian.tools.composition.build_composition:main"
casspian-lindal-inputs = "casspian.tools.lindal.build_inputs:main"
casspian-refrac = "casspian.refrac.product:main"
casspian-plots = "casspian.tools.plots.render:main"

[tool.setuptools.packages.find]
where = ["src"]
