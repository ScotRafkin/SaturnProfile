[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casspian"
version = "0.1.0"
description = "CASSPIAN Saturn atmosphere reference model"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "netCDF4",
]

# Console entry points are added as the tools of SPEC_01 appear.
[project.scripts]
casspian-lindal-raw = "casspian.tools.lindal.build_raw:main"

[tool.setuptools.packages.find]
where = ["src"]
