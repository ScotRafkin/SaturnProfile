# CASSPIAN section (SPEC_20 section 2 deliverable 3): the Lindal anchor transferred to every latitude under
# hypothesis 1. Read by casspian-section. The base run supplies the namelist and the inputs, its wind
# hypothesis 1's (IRIS shear, case ii at 110 mbar, on the Sanchez-Lavega cloud wind); only the anchor
# and the target change.

[section]
name              = "lindal_iris_v_sl_ii_110"
repository_root   = "../.."
base_run          = "lindal_iris_v_sl_ii_110"
anchor_slug       = "lindal"
anchor            = "occul_data/lindal/lindal_refractivity.nc"
# Every 2.5 deg planetocentric (SPEC_20 section 2 deliverable 2). The wind file stops at 90 deg and a
# march's mesh reaches one spacing past its target, so the last latitude is 87.5 (REVIEW_20_step0).
latitude_step_deg  = 2.5
latitude_limit_deg = 87.5
output            = "lindal_iris_v_sl_ii_110_section.nc"
