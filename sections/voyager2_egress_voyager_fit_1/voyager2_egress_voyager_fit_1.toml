# CASSPIAN section (SPEC_20 section 2 deliverable 3): the Voyager 2 egress anchor transferred to every latitude under
# hypothesis 3. Read by casspian-section. The base run supplies the namelist and the inputs, its wind
# voyager_fit_1's; only the anchor and the target change.

[section]
name              = "voyager2_egress_voyager_fit_1"
repository_root   = "../.."
base_run          = "lindal_voyager_fit_1"
anchor_slug       = "voyager2_egress"
anchor            = "occul_data/lindal/voyager2_egress_refractivity.nc"
# The run's composition must be on the anchor's levels: the anchor's own, the same mixture as the base
# run's (94/6 with Lindal's ammonia, REVIEW_20_step0 ruling 2), uniform in latitude.
composition       = "occul_data/lindal/voyager2_egress_composition.nc"
# Every 2.5 deg planetocentric (SPEC_20 section 2 deliverable 2). The wind file stops at 90 deg and a
# march's mesh reaches one spacing past its target, so the last latitude is 87.5 (REVIEW_20_step0).
latitude_step_deg  = 2.5
latitude_limit_deg = 87.5
output            = "voyager2_egress_voyager_fit_1_section.nc"
