# CASSPIAN build control file for the Lindal profile (SPEC_00 section 2.2.2).
# Pointers and declared choices only; every physical value lives in the files this points at.
# Sections are added as the steps that read them appear. Steps 7, 8 and 9 add [wind],
# [composition] and the stage two settings.

[gravity]
# The harmonic set that stands for what the source used. Lindal et al. (1985) cite
# Null et al. (1981); that choice is the content of this section.
source = "../../data_static/harmonics/null1981.toml"
output = "lindal_gravity.nc"
prefix = "lindal"
role   = "reduction"   # SPEC_01 v0.26: required in every section
epoch  = "1981-08-26"  # SPEC_01 v0.28: the date of the occultation the harmonic set serves
title  = "Null et al. (1981) harmonic set, as used in the Lindal reduction"

[rotation]
source = "../../data_static/rotation/system_iii.toml"
entry  = "system_iii"
output = "lindal_rotation.nc"
prefix = "lindal"
role   = "reduction"
epoch  = "1981-08-26"
title  = "System III rotation, as used in the Lindal reduction"


[wind]
# The cloud top wind Lindal carried in his geoid. Pointers and declared choices only.
# The wind is the Ingersoll and Pollard (1982) Fig. 5 solid curve; the Smith et al. (1982)
# Fig. 4 points are the uncertainty. Properties of the data itself live beside the
# digitizations in smith1982_fig4.toml, not here.
wind_source_kind = "curve"
curve_source     = "../../data_static/winds/ingersoll_pollard1982_fig5_curve.csv"
points_source    = "../../data_static/winds/smith1982_fig4_points.csv"
data_properties  = "../../data_static/winds/smith1982_fig4.toml"
gravity_file     = "lindal_gravity.nc"
rotation_file    = "lindal_rotation.nc"
raw_bundle       = "raw/lindal_raw.nc"          # for the reference geoid polar radius
output           = "lindal_wind.nc"
prefix           = "lindal"
role             = "reduction"
title            = "Ingersoll and Pollard (1982) cloud top zonal wind, as used in the Lindal reduction"

# Uncertainty binning of the Smith points.
bin_width_deg     = 2.0
min_count_per_bin = 3

# Assembly rules. Each is flagged in value_provenance and named in the file.
gap_rule        = "reflect_north"      # alternative: "reflect_north_then_bins"
polar_rule      = "pchip_to_zero"      # alternative: "linear_to_zero"
join_window_deg = [-10.9, -15.0]       # reflection weight 1 at the first edge, 0 at the second

# Product grids.
latitude_grid_step_deg = 0.5           # -90 to +90, both poles and the equator as nodes
vertical_structure     = "altitude independent"

# Ten levels per decade from 1 Pa to 1.0e6 Pa. Declared as a list so the grid is auditable.
pressure_grid_Pa = [
  1, 1.25893, 1.58489, 1.99526, 2.51189, 3.16228, 3.98107, 5.01187, 6.30957, 7.94328,
  10, 12.5893, 15.8489, 19.9526, 25.1189, 31.6228, 39.8107, 50.1187, 63.0957, 79.4328,
  100, 125.893, 158.489, 199.526, 251.189, 316.228, 398.107, 501.187, 630.957, 794.328,
  1000, 1258.93, 1584.89, 1995.26, 2511.89, 3162.28, 3981.07, 5011.87, 6309.57, 7943.28,
  10000, 12589.3, 15848.9, 19952.6, 25118.9, 31622.8, 39810.7, 50118.7, 63095.7, 79432.8,
  100000, 125893, 158489, 199526, 251189, 316228, 398107, 501187, 630957, 794328,
  1e+06
]

[composition]
# The composition Lindal assumed. Pointers and declared choices only; the ammonia column and
# the source's own stated H2 fraction come from the raw bundle, the species properties from
# the master table.
raw_bundle     = "raw/lindal_raw.nc"
species_master = "../../data_static/species_master.toml"
species_set    = "lindal1985"
output         = "lindal_composition.nc"
prefix         = "lindal"
role           = "reduction"
title          = "Lindal et al. (1985) reduction composition, 94 percent H2 with He and NH3"

# How the remainder is divided once ammonia is assigned. Checked against the h2_fraction the
# raw bundle transcribes from p. 1137; the tool refuses if the two disagree.
h2_fraction_of_remainder = 0.94
he_fraction_of_remainder = 0.06

nh3_fill_rule = "linear in pressure through the tabulated Table I values, extrapolated beyond them by scipy.interpolate.interp1d(fill_value='extrapolate'), then clamped at zero; ammonia is assigned first and the remainder is split by the two shares above"
vertical_coordinate = "pressure_Pa"
# SPEC_04 decision O: kind C is one structure, a field on (level, latitude). The source's
# single column is written at every node; uniform in latitude is the Lindal hypothesis, and
# the reduction reads the column at phi_c (decision L), which for a uniform field is that
# same column unchanged.
latitude_grid_deg   = [-90.0, 90.0, 1.0]

[stage_two]
# Stage two: the two files nobody else writes, and the manifest that names all six.
# Pointers and declared choices only.
raw_bundle       = "raw/lindal_raw.nc"
prefix           = "lindal"
role             = "reduction"
description      = "Voyager 2 ingress, Lindal, Sweetnam and Eshleman 1985, Table I"
thermo_output    = "lindal_thermo.nc"
geodesy_output   = "lindal_geodesy.nc"
manifest         = "lindal_reduction.toml"
product          = "lindal_refractivity.nc"

# The four files the other tools wrote; verified present and valid, not rebuilt here.
gravity_file     = "lindal_gravity.nc"
rotation_file    = "lindal_rotation.nc"
wind_file        = "lindal_wind.nc"
composition_file = "lindal_composition.nc"

# The reduction's declared choices, carried into the manifest.
anchor_isobar_Pa          = 1.0e4     # the surface the source fitted a geoid on
fixed_point_tolerance_deg = 1.0e-6
max_iterations            = 20
geoid_anchor_surface_Pa   = 1.0e4
geoid_anchor_quantity     = "radius_equatorial_m"   # SPEC_02 v0.8 Step 6: the equatorial radius
geoid_anchor_rule         = "equatorial_radius"     # how the one constant of Eq. B3 is fixed
geoid_convergence_m       = 1.0

# The standard diagnostics, carried into the manifest's [diagnostics] section (SPEC_02 Step 5).
diagnostics_figures       = true
diagnostics_format        = "png"
diagnostics_dpi           = 150
